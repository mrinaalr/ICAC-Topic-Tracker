threads:
  - id: coverage-estimate
    title: "Estimate the share of cases where hash matching was the first detection event"
    detail: >-
      Public case narratives often state how a case originated — a CyberTip, a
      proactive investigation, an undercover operation, a report from a third party.
      Aggregating that field gives a defensible estimate of how much of the record
      hash matching actually originates, and how much arrives another way.
    kind: dataset
    effort: medium
    status: open
    skills: [data-engineering, nlp, statistics]
    done_when:
      - An origination breakdown over a public corpus with stated sample size
      - Explicit treatment of cases where origination is not stated
      - Method and code published so the figure can be reproduced

