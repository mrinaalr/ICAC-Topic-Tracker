id: financial-sextortion
label: "Financially Motivated Sextortion"
aliases:
  - "financial sextortion"
  - "sextortion for money"

domain: vectors
category: sextortion

definition: >-
  Sextortion in which the demand is money rather than further imagery. An offender
  acquires an intimate image, usually by deception over a short contact window, then
  threatens exposure unless payment is made. Distinguished from imagery-motivated
  sextortion by the demand type, the compressed timeline, and a markedly different
  victim profile.

why_it_matters: >-
  The pattern scales in a way that imagery-motivated sextortion does not: the offender
  does not need sustained access to a specific child, contact-to-demand can run in
  hours, and the operation parallelises across many targets at once. Victim
  demographics invert the usual profile, skewing toward adolescent boys. Reported
  volumes have risen sharply, and the compressed timeline leaves a very narrow window
  for any intervention that depends on detection and response.

current_understanding: >-
  Public advisories describe a consistent script: contact on a mainstream platform
  using a fabricated persona, rapid escalation to intimate imagery, migration to a
  second channel, then a payment demand backed by threat of exposure to the victim's
  contact list. Payment is typically requested through gift cards, peer-to-peer
  payment apps, or cryptocurrency. Retained imagery keeps the leverage alive after any
  single account is banned, which is why account-level enforcement alone does not end
  the coercion.

open_questions:
  - Where in the compressed timeline can intervention realistically land?
  - Do payment-rail signals generalise well enough to support upstream disruption?
  - What messaging actually reduces the harm of the initial threat once imagery exists?

maturity: active

intervention_point: [platform_prevention, detection_monitoring, victim_safeguarding, investigation_attribution]
affordance_class: [contact_approach, production, possession_trade]
lifecycle_stage: [initial_contact, conditioning, exploitation, maintenance]

