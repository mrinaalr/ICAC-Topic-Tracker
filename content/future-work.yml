# Future work brief — compiled onto the Future Threats tab.
#
# The structural shifts and research priorities originate in public notes
# (End Child Exploitation's Future Threats brief, and later IWF / WeProtect
# reporting). Each item is filed against a topic in this tracker where one
# exists, or against a taxonomy slot that is still empty. That is the point:
# the tab is a map onto the rest of the tracker, not a second copy of it.
#
#   https://end-child-exploitation.com/

updated: "2026-08-24"

framing: >-
  As technology evolves and exploitation methods adapt, the offense is no longer
  bounded the way it was in the pre-digital age. Abuse still happens in person;
  what has changed is the resources an offender can reach for — who they can
  select, how they can be aided by a model they still direct, whether a system
  can plan and execute without that direction, and whether they have to act
  alone. This tab tracks those structural shifts and the research still needed,
  filed against topics and ontology classes rather than as a free-standing essay.

