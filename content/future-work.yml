horizon_questions:
  - How will AI and emerging technologies evolve exploitation methods?
  - How can legal frameworks keep pace with rapid technological change?
  - What tools can detect and prevent harm before it occurs?
  - How can privacy, security, and child protection be balanced without collapsing one into another?
  - What interventions are most effective at preventing exploitation, and against what baseline?
