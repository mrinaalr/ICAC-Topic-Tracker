    url: https://arxiv.org/abs/2110.07450
    type: paper
    date: "2021"
    note: "The principal technical critique; the reference point most later work argues with."
  - title: "CAC Ontology — detection module"
    url: https://github.com/Project-VIC-International/CAC-Ontology
    type: ontology
    publisher: "Project VIC International"

