id: ai-enabled-grooming
label: "AI-Enabled Grooming & Impersonation"
aliases:
  - "LLM-assisted grooming"
  - "generative impersonation"
  - "AI chatbot grooming"

domain: future-threats
category: ai-enabled-offending

definition: >-
  The use of generative models as a tool the offender still directs, rather than
  as a system that plans and acts on its own. Covers generated grooming language,
  fabricated or celebrity-like personas that can sustain a conversation, and the
  use of models to refine an approach against a specific target — make this
  image, write this script, impersonate this person. The human holds the vision
  and the next step. Distinct from AI-generated CSAM as a production problem,
  and distinct from agent-facilitated offending, where the system plans, chains
  actions, and executes. An agent uses AI; using AI does not make the work an
  agent.

why_it_matters: >-
  Imagery synthesis is already tracked, charged, and partially modelled in the
  ontology. Text-and-persona synthesis is not. If a model can produce the
  language of grooming, impersonate a peer or an idol, and adapt to the target,
  then the scarce resource in the offense — time, social skill, a convincing
  identity — is no longer scarce in the same way. That is already happening, and
  it is already risky. It is still a person executing their own plan through a
  model. Detection built for files does not see this; detection built for known
  grooming scripts will see only the scripts it has. Collapsing this into
  agent-facilitated offending hides that the agent case is a further step:
  the plan itself leaving the person.

current_understanding: >-
  Public notes on future threats treat AI as an aid across every avenue of the
  offense, not only as an image generator — the directed-tool pattern this
  topic names. The CAC Ontology has a rich set of impersonation and
  fabricated-persona classes in the grooming and sextortion modules, and a
  generative-synthesis affordance on the platforms side that is scoped to
  media. There is no class for generative text used to groom, and no class for
  a conversational model used as a directed tool. Threat assessments record
  rapid growth in AI-generated imagery; comparable public measurement for
  AI-assisted contact is thinner, which is itself a gap. Chatbots that answer
  a person's prompts belong here. Systems that plan and execute with little
  turn-by-turn direction belong in Agent-Facilitated and Orchestrated Offending.

open_questions:
  - What share of contact offending, if any, already involves generated language used as a directed tool, and what public signal would show it?
  - Do existing impersonation classes cover a model-written persona that a person still operates, or does generated language change the class?
  - What would a detection or disruption approach look like that does not require reading the content of private messages?

maturity: emerging

intervention_point: [platform_prevention, detection_monitoring]
affordance_class: [contact_approach]
lifecycle_stage: [initial_contact, conditioning]

cac_alignment:
  status: partial
  classes:
    - https://cacontology.projectvic.org/grooming#FabricatedPersona
    - https://cacontology.projectvic.org/grooming#TeenageImpersonationGrooming
    - https://cacontology.projectvic.org/grooming#PeerPersonaGrooming
    - https://cacontology.projectvic.org/grooming#GroomingMessage
    - https://cacontology.projectvic.org/grooming#GroomingPattern
    - https://cacontology.projectvic.org/grooming#MultipleAccountGrooming
    - https://cacontology.projectvic.org/sextortion#IdentityImpersonation
    - https://cacontology.projectvic.org/platforms#GenerativeSynthesis
  notes: >-
    Impersonation, fabricated personas, grooming messages, and generative media
    synthesis are modelled. What is missing is generative text used as a directed
    tool — a model producing the language a person still operates, rather than a
    human using a false identity they wrote themselves. GenerativeSynthesis is an
    affordance for synthetic media, not for language. Conversational agents that
    plan and execute are not this gap; they are the sibling category. An extension
    here would need a class for model-assisted contact that remains human-directed.

threads:
  - id: class-proposal
    title: "Draft a CAC class for model-assisted contact offending"
    detail: >-
      Compare FabricatedPersona, IdentityImpersonation, GroomingMessage, and
      GenerativeSynthesis against the claim that a model can produce grooming
      language a person still directs. Write the smallest class or property that
      would make directed-tool contact checkable, with examples drawn only from
      public reporting, and a note on what would be out of scope. Do not fold
      planning-and-execution agents into this class — that distinction belongs
      on the agent-facilitated topic.
    kind: ontology
    effort: small
    status: open
    skills: [semantic-web, knowledge-graphs, writing]
    done_when:
      - A proposed class or property with a label, definition, and parent
      - Explicit contrast with the four existing classes named above
      - A short list of public sources the definition is accountable to
  - id: public-signal
    title: "Catalogue public reporting of AI used in contact offending, not imagery"
    detail: >-
      Separate AI-as-image-generator from AI-as-aid-to-contact in published
      reporting, prosecutions, and platform transparency notes. The output is a
      sourced inventory, not an incident list, and must not identify victims or
      offenders.
    kind: threat-intel
    effort: medium
    status: open
    skills: [writing, criminology, policy-analysis]
    done_when:
      - A table of public items, each classified as imagery, contact-aid, or both
      - "A stated residual: what this inventory cannot see"

