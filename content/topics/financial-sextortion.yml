threads:
  - id: timeline-measurement
    title: "Measure the contact-to-demand interval from public records"
    detail: >-
      Intervention design depends on how much time actually exists between first
      contact and first demand. Public advisories describe it qualitatively as hours.
      Extract what public case records and charging documents actually state.
    kind: research
    effort: small
    status: open
    skills: [data-engineering, statistics]
    done_when:
      - A distribution of stated intervals with sample size and source per observation
      - An explicit account of selection bias in the underlying records
  - id: payment-rail-signals
    title: "Catalogue publicly documented payment-rail disruption approaches"
    detail: >-
      Payment providers sit at a chokepoint in the financial variant. Catalogue what
      has been publicly described, by whom, and with what reported effect.
    kind: research
    effort: small
    status: open
    skills: [policy-analysis, trust-safety]
    done_when:
      - A sourced list of approaches with the organisation and date for each
      - A note on which are verifiable from public reporting and which are claims

