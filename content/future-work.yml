# Future work brief — compiled onto the Future Threats tab.
#
# The structural shifts and research priorities originate in End Child
# Exploitation's public notes. Each item is filed against a topic in this
# tracker where one exists, or against a taxonomy slot that is still empty.
# That is the point: the tab is a map onto the rest of the tracker, not a
# second copy of it.
#
#   https://end-child-exploitation.com/

updated: "2026-08-24"

framing: >-
  As technology evolves and exploitation methods adapt, the offense is no longer
  bounded the way it was in the pre-digital age. Abuse still happens in person;
  what has changed is the resources an offender can reach for — who they can
  select, how they can be aided, and whether they have to act alone. This tab
  tracks those structural shifts and the research still needed, filed against
  topics and ontology classes rather than as a free-standing essay.

sources:
  - title: "Future Work & Research Gaps"
    url: "https://end-child-exploitation.com/END%20CHILD%20EXPLOITATION/FUTURE%20WORK%20&%20RESEARCH%20GAPS%202bba7cd8255280379bfee22ba5adbab3"
    type: post
    publisher: "End Child Exploitation"
  - title: "Future Threats"
    url: "https://end-child-exploitation.com/END%20CHILD%20EXPLOITATION/FUTURE%20WORK%20&%20RESEARCH%20GAPS/Future%20Threats%202bca7cd825528065bdedf10b1e37d50b"
    type: post
    publisher: "End Child Exploitation"
  - title: "Global Threat Assessment 2023"
    url: "https://www.weprotect.org/global-threat-assessment-23/"
