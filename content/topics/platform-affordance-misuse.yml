threads:
  - id: pre-deployment-review-checklist
    title: "Turn affordance review into a checklist a product team can actually run"
    detail: >-
      A pre-deployment review procedure exists on paper: decompose a proposed feature
      into affordances, map each to capabilities already documented in the enforcement
      record, estimate comparative misuse leverage per plausible offender goal, then
      target mitigation at the highest-leverage link. It has been demonstrated once,
      by hand, on a hypothetical product. Nothing automates or standardises it.
    kind: build
    effort: medium
    status: open
    skills: [trust-safety, hci, writing]
    done_when:
      - A written procedure a non-researcher product team can follow end to end
      - At least two worked examples on real, shipped capabilities
      - Output format that names the affordance, the leverage estimate, and the design-level mitigation
  - id: affordance-scoring-evidence
    title: "Establish what evidence supports comparative affordance scoring"
    detail: >-
      Comparative scoring is currently ordinal and argued from the record rather than
      fitted. Determine what the public enforcement corpus can and cannot support, and
      whether an ordinal ranking is defensible or should be replaced with something weaker.
    kind: research
    effort: medium
    status: open
    skills: [statistics, criminology]
    done_when:
      - A written account of what the corpus supports
      - An explicit statement of what would falsify the scoring approach

