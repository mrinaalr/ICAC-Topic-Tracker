id: platform-affordance-misuse
label: "Platform Affordance Misuse"
aliases:
  - "affordances for harm"
  - "misuse surface"
  - "capability misuse"

domain: technology
category: platform-design

definition: >-
  An affordance is what a platform's design makes possible — anonymity, ephemerality,
  contact discovery, unmonitored communication, distribution infrastructure. Affordance
  misuse is the offender-facing operationalisation of one of those neutral capabilities
  toward exploitation. The concept separates three things that are usually collapsed:
  what the platform enables, how an offender uses it, and what happens to the child.

why_it_matters: >-
  Enforcement records and online-harms research routinely name a platform without
  explaining what about the medium made the offense possible. Naming the affordance
  rather than the product turns a platform mention into something transferable: the
  same capability appears on the next platform under a different brand, and a mitigation
  designed against the capability survives the platform's decline.

current_understanding: >-
  Analysis of a large public ICAC enforcement corpus finds the same five capability
  types recurring across platform generations and across two decades, implemented
  differently each time and producing comparable offense mechanics. The CAC Ontology
  models this directly as of v3.1.0, with an AffordanceMisuse class and named
  affordance classes under the platforms module, plus properties linking an affordance
  to the lifecycle transitions it enables. What remains contested is whether affordance
  risk can be scored comparatively before a capability ships, and on what evidence base.

open_questions:
  - Can the marginal exploitation risk of a proposed capability be estimated before deployment, and what would count as evidence for such an estimate?
  - Do affordance profiles predict harm profiles well enough to be actionable, or only well enough to be descriptive?
  - How should composed affordances be scored when each is low-risk alone and high-risk together?

maturity: active

intervention_point: [platform_prevention, detection_monitoring]
affordance_class: [contact_approach, production, possession_trade, coordination]
lifecycle_stage: [initial_contact, conditioning, exploitation, maintenance]

