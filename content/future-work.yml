# Structural shifts. Cards on the Future Threats tab.
structural_shifts:
  - id: selection-without-geography
    label: Selection without geography
    summary: >-
      Contact is no longer limited to children an offender can physically reach.
      The selection process scales with the network, not with proximity.
    topic: unconstrained-victim-selection
  - id: public-data-targeting
    label: Public-data targeting
    summary: >-
      Potential victims can be filtered from public profiles, contacted, and
      the approach adapted to what the profile discloses.
    topic: unconstrained-victim-selection
  - id: ai-as-aid
    label: AI-Enhanced
    summary: >-
      Generative models carry out a request the offender still plans: write this
      script, impersonate this person, produce this image. Distinct from
      AI-generated imagery as a production problem, and distinct from agents
      that plan and execute.
    topic: ai-enabled-grooming
  - id: agent-as-actor
    label: Agent-Facilitated and Orchestrated Offending
    summary: >-
      Software agents plan, chain actions, and execute with little turn-by-turn
      direction. This is a step above AI-enhanced offending: the scarce resource
      is no longer the offender's time or skill.
    topic: agent-facilitated-offending
  - id: offender-community
    label: Offender community formation
    summary: >-
      People with this intent can find each other, reinforce the intent, and
      share methods at a scale that was not possible when each acted in isolation.
    topic: offender-community-formation

